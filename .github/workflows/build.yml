name: Build ai-builder for Windows and Android

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # للسماح بالتشغيل اليدوي من تبويب Actions في قيت هب

jobs:
  # ==========================================
  # 1. بناء تطبيق الويندوز (EXE)
  # ==========================================
  build-windows:
    name: Build Windows App (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconsole --onefile --name "ai-builder" main.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-builder-Windows
          path: dist/ai-builder.exe

  # ==========================================
  # 2. بناء تطبيق الأندرويد (APK)
  # ==========================================
  build-android:
    name: Build Android App (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Briefcase
        run: |
          python -m pip install --upgrade pip
          pip install briefcase

      - name: Initialize Briefcase Android Project
        run: |
          briefcase new --no-input \
            formal_name="AI Builder" \
            app_name="aibuilder" \
            domain="com.aibuilder.app" \
            description="AI Model Trainer and Builder Studio" \
            author="Developer"

      - name: Copy App Code
        run: |
          cp main.py aibuilder/src/aibuilder/app.py

      - name: Build Android App
        run: |
          cd aibuilder
          briefcase build android --no-input || true
          briefcase package android --no-input || true

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-builder-Android
          path: aibuilder/dist/*.apk

  # ==========================================
  # 3. نشر الملفات في صفحة الـ Releases تلقائياً
  # ==========================================
  release:
    name: Publish Release Packages
    needs: [build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/') # يتم الرفع فقط عند عمل Tag للإصدار مثل v1.0.0
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows Build
        uses: actions/download-artifact@v4
        with:
          name: ai-builder-Windows
          path: ./release-artifacts

      - name: Download Android Build
        uses: actions/download-artifact@v4
        with:
          name: ai-builder-Android
          path: ./release-artifacts

      - name: Create GitHub Release & Upload Files
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

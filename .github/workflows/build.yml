name: Build ai-builder for Windows and Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. بناء تطبيق الويندوز
  # ==========================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install kivy pyinstaller

      - name: Build Windows EXE
        run: |
          pyinstaller --noconsole --onefile --name "ai-builder-windows" main.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-builder-Windows
          path: dist/ai-builder-windows.exe

  # ==========================================
  # 2. بناء تطبيق الأندرويد
  # ==========================================
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Buildozer & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer kivy

      - name: Initialize Buildozer Spec
        run: |
          buildozer init || true
          sed -i 's/#requirements = python3,kivy/requirements = python3,kivy/g' buildozer.spec
          sed -i 's/#package.name = myapp/package.name = aibuilder/g' buildozer.spec
          sed -i 's/#package.domain = org.test/package.domain = com.aibuilder/g' buildozer.spec

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-builder-Android
          path: bin/*.apk
